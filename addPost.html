<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">  <!-- Link to the CSS file -->
    <title>WAD Homework 1</title>             <!-- Title of the webpage in browser tab -->
    <style>
      a:link {
        color: black;
        background-color: transparent;
        text-decoration: none;
      }
    </style>
    </head>

    <body>
    <header class="header">
            <a href="index.html"><strong>Home</strong></a>        <!-- Link to the home page -->
            <a class="logo" href="login.html"><img src="img/download.png" width="80" height="80" alt="My picture"></a>   <!-- Logo link -->
    </header>

    <div class="main-content">                                <!-- addPost content area that contains the main content -->
      <main class="window-content">
        <form action="index.html?" method="get" class="post-form">
                <!-- Text field -->
                <div class="form-group">
                    <label for="post-body">Post<br></label>
                    <textarea id="post-body" placeholder="textarea"></textarea>
                </div>

                <!-- Choose file -->
                <div class="form-group">
                    <label for="file-upload">Select<br>file</label>
                    <input type="file" id="file-upload">
                </div>

                <!-- Button -->
                <div class="form-actions">
                    <button type="submit" class="button">Create post</button>
                </div>
        </form>
    </main>
    </div>
  
</body>
</html>
